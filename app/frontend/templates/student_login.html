<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login | CognifAce</title>
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <div class="fcrit-header">
    <img src="/static/fcritlogo.png" alt="FCRIT Logo">
    <div class="fcrit-header-text">
      <h1>Fr. C. Rodrigues Institute of Technology, Vashi</h1>
      <p>Department of Information Technology — FH 2026</p>
    </div>
  </div>
  <div class="fcrit-nav">
    <span>CognifAce — Student Portal</span>
    <span class="dept">View Your Attendance</span>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Student Login</h2>
        <p>Enter your Roll Number to view attendance</p>
      </div>
      <div class="login-card-body">
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="post" action="/student/login">
          <div class="form-group">
            <label>Roll Number</label>
            <input type="text" name="roll_no" placeholder="e.g. 5024101" required autofocus>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-box">
              <input type="password" name="password" id="pwd" placeholder="Enter password" required>
              <span class="eye" onclick="document.getElementById('pwd').type=document.getElementById('pwd').type==='password'?'text':'password'">👁️</span>
            </div>
          </div>
          <button type="submit" class="btn-login">View My Attendance</button>
        </form>
      </div>
    </div>
  </div>
  <div class="fcrit-footer">&copy; 2026 Fr. C. Rodrigues Institute of Technology</div>
</body>
</html>
